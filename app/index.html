<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>9Bolsillos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0E1116;--bg2:#161B22;--bg3:#1A1F27;--line:#232A33;--tx:#F2F4F7;--tx2:#C5CBD3;--tx3:#9AA3AE;--up:#3DDC97;--down:#F2A65A;--blue:#5B8DEF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
a{color:var(--up);text-decoration:none}
button,input,select{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:18px 16px 96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#0B0E12;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:760px}
nav.tabs a{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--tx3)}
nav.tabs a.on{color:var(--up)}
h1{font-size:24px;margin:0}
h2{font-size:17px;margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:4px}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--tx3);font-size:13px}
.card{background:var(--bg2);border-radius:14px;padding:14px}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em}
.up{color:var(--up)}.down{color:var(--down)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:40px;padding:0 14px;border:none;border-radius:10px;background:var(--bg3);color:var(--tx2);font-weight:600;cursor:pointer}
.pill.on{background:var(--tx);color:var(--bg)}
.btn{min-height:46px;padding:0 18px;border:none;border-radius:12px;background:var(--up);color:var(--bg);font-weight:700;cursor:pointer}
.btn.sec{background:var(--bg3);color:var(--tx)}
.btn.warn{background:#3A1F1F;color:#FFB4A8}
input[type=text],input[type=number],input[type=search],select{height:44px;border-radius:10px;border:1px solid #39404B;background:var(--bg);padding:0 12px;min-width:0}
.list a.item,.list div.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--tx)}
.thumb{width:40px;height:56px;border-radius:4px;background:var(--bg3);object-fit:cover;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;color:var(--tx);cursor:pointer;background:none;border:none;padding:0;text-align:left}
.tile .img{position:relative;aspect-ratio:63/88;border-radius:7px;background:var(--bg3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--tx3);padding:6px;text-align:center}
.tile .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.miss .img img{filter:grayscale(1);opacity:.35}
.tile.miss .img{outline:2px dashed #39404B;outline-offset:-2px}
.tile .fbn{position:relative;z-index:1}
.tile .num{font-size:11px;font-weight:700;color:var(--tx3)}
.tile .nm{font-size:12px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .pr{font-size:12px;color:var(--tx2)}
.tile .own{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:15px;border:none;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;z-index:2}
.tile.has .own{background:var(--up);color:var(--bg)}
.tile.miss .own{background:rgba(14,17,22,.85);color:var(--tx2);border:1px solid #39404B}
.bar{height:8px;border-radius:4px;background:#262C36;overflow:hidden}.bar>div{height:100%;background:var(--up)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--tx3);font-weight:600}
.hero{width:180px;aspect-ratio:63/88;border-radius:10px;background:var(--bg3);object-fit:cover;flex-shrink:0}
.alertbox{background:#12271D;border:1px solid #2B6E4C;border-radius:14px;padding:14px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--tx2)}
.center{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:480px;margin:0 auto}
.spread{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.page{background:#12161C;border:1px solid var(--line);border-radius:12px;padding:12px}
.pgnum{font-size:12px;color:var(--tx3);margin-bottom:8px;font-weight:600}
.pockets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pockets .tile .nm,.pockets .tile .pr{font-size:11px}
.tile.empty .img{background:#0B0E12;outline:1px solid var(--line)}
button.pill:disabled{opacity:.35;cursor:default}
@media (max-width:520px){.hero{width:130px}.big{font-size:32px}}
</style>
</head>
<body>

</div></nav>
