name: Sonda de fotos
on:
  push:
    branches: [prueba-fotos]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download datos --pattern 9bolsillos.db
          python3 tiendas_sonda.py
      - run: |
          git config user.name sonda && git config user.email sonda@users.noreply.github.com
          git add -f tiendas.json && git commit -m "Informe [skip ci]" && git push
