name: Sonda de fotos
on:
  push:
    branches: [prueba-fotos]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download datos --pattern 9bolsillos.db
          python3 kom.py
          python3 sellado.py --db 9bolsillos.db --out sellado.json 2>&1 | tee sellado.log
      - run: |
          git config user.name sonda && git config user.email sonda@users.noreply.github.com
          git add -f komiya.json sellado.json sellado.log && git commit -m "Informe [skip ci]" && git push
