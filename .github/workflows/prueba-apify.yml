name: prueba-apify
on:
  push:
    branches: [prueba-apify]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          import json, os, urllib.request
          tok = os.environ.get('APIFY_TOKEN')
          print('token presente:', bool(tok))
          ACT = 'scrapersdelight~cardmarket-scraper'
          def call(method, path, body=None, timeout=60):
              req = urllib.request.Request('https://api.apify.com/v2' + path, data=json.dumps(body).encode() if body is not None else None,
                                           method=method, headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read())
          # 1) esquema de entrada del actor (para usar los nombres exactos)
          try:
              b = call('GET', f'/acts/{ACT}/builds/default')['data']
              sch = json.loads(b.get('inputSchema') or '{}') if isinstance(b.get('inputSchema'), str) else (b.get('inputSchema') or {})
              for k, v in (sch.get('properties') or {}).items():
                  print('  input', k, '|', v.get('type'), '|', str(v.get('enum') or v.get('default') or '')[:120], '|', (v.get('description') or '')[:140].replace('\n', ' '))
          except Exception as e:
              print('esquema: error', e)
          # 2) prueba con 3 cartas, tope de gasto 0,10 $
          inp = {'mode': 'offers', 'game': 'pokemon', 'productIds': [886509, 886393, 563557], 'languages': ['Spanish', 'Japanese'], 'minCondition': 'NM', 'maxOffersPerProduct': 3, 'includeProductRows': True}
          try:
              items = call('POST', f'/acts/{ACT}/run-sync-get-dataset-items?maxTotalChargeUsd=0.10&timeout=240', inp, timeout=300)
              print('filas:', len(items))
              for it in items[:20]:
                  print(json.dumps(it, ensure_ascii=False)[:1200])
          except urllib.error.HTTPError as e:
              print('run: HTTP', e.code, e.read()[:800])
          except Exception as e:
              print('run: error', e)
