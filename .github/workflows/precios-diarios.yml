name: Precios diarios de Cardmarket

on:
  schedule:
    - cron: "17 4 * * *"   # todos los días a las 04:17 UTC (05:17 en Madrid en invierno)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]
    paths: ["app/**", "build_db.py", "update_prices.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PRICE_GUIDE_URL: "https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json"
  SINGLES_URL: "https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json"
  SEALED_URL: "https://downloads.s3.cardmarket.com/productCatalog/productList/products_nonsingles_6.json"
  RELEASE_TAG: datos

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar la base de datos actual (para conservar el historial)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern 9bolsillos.db --clobber && mv 9bolsillos.db anterior.db

      - name: Descargar la guía de precios de hoy
        run: curl -fsSL --retry 3 -A "9Bolsillos-precios/1.0" "$PRICE_GUIDE_URL" -o price_guide.json

      - name: Descargar catálogos de Cardmarket (si fallan, se usan los guardados en el repositorio)
        run: |
          mkdir -p catalogos
          curl -fsSL --retry 2 -A "9Bolsillos-precios/1.0" "$SINGLES_URL" -o catalogos/singles.json || cp datos/products_singles_6.json catalogos/singles.json
          curl -fsSL --retry 2 -A "9Bolsillos-precios/1.0" "$SEALED_URL" -o catalogos/sealed.json || cp datos/products_nonsingles_6.json catalogos/sealed.json
          ls -la catalogos

      - name: Descargar la base de cartas de TCGdex (sets y cartas nuevas)
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git tcgdex

      - name: Reconstruir la base de datos conservando el historial
        run: |
          python3 build_db.py --tcgdex tcgdex --singles catalogos/singles.json --sealed catalogos/sealed.json \
            --prices price_guide.json --history-from anterior.db --out 9bolsillos.db \
          || (echo "La reconstrucción falló: solo se actualizan los precios" && cp anterior.db 9bolsillos.db && python3 update_prices.py --db 9bolsillos.db --prices price_guide.json)

      - name: Guardar la base de datos actualizada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" 9bolsillos.db --clobber

      - name: Preparar la web
        run: |
          mkdir -p _site
          cp -r app/* _site/
          cp 9bolsillos.db _site/
          python3 -c "import sqlite3,json; m=dict(sqlite3.connect('9bolsillos.db').execute('SELECT key,value FROM meta').fetchall()); json.dump({'prices_date': m.get('prices_date'), 'built_at': m.get('built_at','')}, open('_site/version.json','w'))"
          cat _site/version.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
