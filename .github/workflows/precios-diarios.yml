name: Precios diarios de Cardmarket

on:
  schedule:
    - cron: "17 4 * * *"   # todos los días a las 04:17 UTC (05:17 en Madrid en invierno)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]
    paths: ["app/**", "build_db.py", "update_prices.py", "export_web.py", "wikidex.py", "sellado.py", "fotos.py", "tiendas.py", "widget.py", "ics.py", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PRICE_GUIDE_URL: "https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json"
  SINGLES_URL: "https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json"
  SEALED_URL: "https://downloads.s3.cardmarket.com/productCatalog/productList/products_nonsingles_6.json"
  RELEASE_TAG: datos

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar la base de datos actual (para conservar el historial)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern 9bolsillos.db --clobber && mv 9bolsillos.db anterior.db

      - name: Descargar la guía de precios de hoy
        run: curl -fsSL --retry 3 -A "9Bolsillos-precios/1.0" "$PRICE_GUIDE_URL" -o price_guide.json

      - name: Descargar catálogos de Cardmarket (si fallan, se usan los guardados en el repositorio)
        run: |
          mkdir -p catalogos
          curl -fsSL --retry 2 -A "9Bolsillos-precios/1.0" "$SINGLES_URL" -o catalogos/singles.json || cp datos/products_singles_6.json catalogos/singles.json
          curl -fsSL --retry 2 -A "9Bolsillos-precios/1.0" "$SEALED_URL" -o catalogos/sealed.json || cp datos/products_nonsingles_6.json catalogos/sealed.json
          ls -la catalogos

      - name: Descargar la base de cartas de TCGdex (sets y cartas nuevas)
        run: git clone --depth 1 https://github.com/tcgdex/cards-database.git tcgdex

      - name: Reconstruir la base de datos conservando el historial
        run: |
          python3 build_db.py --tcgdex tcgdex --singles catalogos/singles.json --sealed catalogos/sealed.json \
            --prices price_guide.json --history-from anterior.db --out 9bolsillos.db \
          || (echo "La reconstrucción falló: solo se actualizan los precios" && cp anterior.db 9bolsillos.db && python3 update_prices.py --db 9bolsillos.db --prices price_guide.json)

      - name: Quién es o dónde está (resúmenes de WikiDex para partidarios y estadios)
        continue-on-error: true
        run: |
          curl -fsSL "https://pablolaraj8-stack.github.io/9bolsillos-precios-a/entrenadores.json" -o entrenadores_prev.json || echo '{}' > entrenadores_prev.json
          python3 wikidex.py --db 9bolsillos.db --prev entrenadores_prev.json --out entrenadores.json

      - name: Fotos del producto sellado de cada set (WikiDex)
        continue-on-error: true
        run: |
          curl -fsSL "https://pablolaraj8-stack.github.io/9bolsillos-precios-a/sellado.json" -o sellado_prev.json || echo '{}' > sellado_prev.json
          python3 sellado.py --db 9bolsillos.db --prev sellado_prev.json --out sellado.json || cp sellado_prev.json sellado.json

      - name: Precios del sellado en tiendas españolas
        continue-on-error: true
        run: |
          curl -fsSL "https://pablolaraj8-stack.github.io/9bolsillos-precios-a/tiendas_hist.json" -o tiendas_hist_prev.json || echo '{}' > tiendas_hist_prev.json
          python3 tiendas.py --db 9bolsillos.db --out tiendas.json --hist-prev tiendas_hist_prev.json --hist-out tiendas_hist.json || curl -fsSL "https://pablolaraj8-stack.github.io/9bolsillos-precios-a/tiendas.json" -o tiendas.json || true
          [ -s tiendas_hist.json ] || cp tiendas_hist_prev.json tiendas_hist.json

      - name: Fotos de las cartas que TCGdex no tiene (CollectHolo y pokemontcg.io)
        continue-on-error: true
        run: |
          curl -fsSL "https://pablolaraj8-stack.github.io/9bolsillos-precios-a/fotos.json" -o fotos_prev.json || echo '{}' > fotos_prev.json
          python3 fotos.py --db 9bolsillos.db --prev fotos_prev.json --out fotos.json || cp fotos_prev.json fotos.json

      - name: Guardar la base de datos actualizada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" 9bolsillos.db --clobber

      - name: Preparar la web (descarga diaria ligera)
        run: |
          mkdir -p _site
          cp -r app/* _site/
          # Fuerza a los móviles a bajar los archivos nuevos en cada publicación (evita que se queden con la versión vieja en caché)
          sed -i -E "s/\?v=[0-9a-z]+/?v=${GITHUB_SHA::7}/g" _site/index.html
          python3 export_web.py --db 9bolsillos.db --out _site
          cp entrenadores.json _site/ 2>/dev/null || cp entrenadores_prev.json _site/entrenadores.json 2>/dev/null || true
          cp sellado.json _site/ 2>/dev/null || true
          cp fotos.json _site/ 2>/dev/null || true
          cp tiendas.json _site/ 2>/dev/null || true
          cp tiendas_hist.json _site/ 2>/dev/null || true
          python3 ics.py _site/lanzamientos.ics || true
          ls -la _site | head -40
          cat _site/version.json

      - name: Datos del widget (valor de cada colección con widget activado)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 widget.py --db 9bolsillos.db --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar un poco si la publicación ha fallado (GitHub a veces tarda en ver el paquete)
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        name: Reintentar la publicación si ha fallado
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar otra vez si ha vuelto a fallar
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120
      - name: Último intento de publicación
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Enviar avisos al móvil
        if: github.event_name != 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          pip install --quiet pywebpush
          python3 notify.py --db 9bolsillos.db --site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
